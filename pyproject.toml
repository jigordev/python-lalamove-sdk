[project]
name = "lalamove-sdk"
version = "0.1.0"
description = "Python SDK for the Lalamove API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Igor Melo", email = "jigordev@gmail.com" }
]
keywords = ["lalamove", "sdk", "logistics", "delivery", "api"]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "inflection>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/jigordev/python-lalamove-sdk"
Repository = "https://github.com/jigordev/python-lalamove-sdk"
Issues = "https://github.com/jigordev/python-lalamove-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lalamove"]
